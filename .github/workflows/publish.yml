name: Publish wasm-client-sdk to npm

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
  workflow_dispatch: {}

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check if version changed
        id: check
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view @droppii-org/wasm-client-sdk version 2>/dev/null || echo "0.0.0")

          echo "Current version: $CURRENT_VERSION"
          echo "Published version: $PUBLISHED_VERSION"

          if [ "$CURRENT_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

  publish:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm with trusted publishing support
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public

  bump-chat-sdk:
    needs: [check-version, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout droppii/chat
        uses: actions/checkout@v4
        with:
          repository: droppii/chat
          token: ${{ secrets.CHAT_REPO_PAT }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump @droppii-org/wasm-client-sdk in packages/chat-sdk
        id: bump
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          BRANCH="bump-wasm-client-sdk-$VERSION"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          npm pkg set "dependencies.@droppii-org/wasm-client-sdk=$VERSION" \
            --prefix packages/chat-sdk

          pnpm install --no-frozen-lockfile

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add packages/chat-sdk/package.json pnpm-lock.yaml
          git commit -m "chore(chat-sdk): bump @droppii-org/wasm-client-sdk to $VERSION"
          git push -u origin "$BRANCH" --force

      - name: Open PR to droppii/chat
        env:
          GH_TOKEN: ${{ secrets.CHAT_REPO_PAT }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          BRANCH="${{ steps.bump.outputs.branch }}"

          EXISTING=$(gh pr list --repo droppii/chat --head "$BRANCH" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open for $BRANCH, skipping create"
            exit 0
          fi

          BODY="Tự động tạo sau khi \`@droppii-org/wasm-client-sdk@$VERSION\` publish thành công lên npm (droppii/droppii-wasm-client-sdk).\n\npnpm-lock.yaml đã được cập nhật tự động. Cần review thủ công: chạy \`type-check\` và build trước khi merge — workflow này chưa tự chạy verify ở phía \`chat\`."

          gh pr create --repo droppii/chat --base main --head "$BRANCH" \
            --title "chore(chat-sdk): bump @droppii-org/wasm-client-sdk to $VERSION" \
            --body "$(printf '%b' "$BODY")"
